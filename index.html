<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>METRO DROP — кейсы Metro Royale</title>
<style>

:root{--bg:#0e0f13;--card:#181a21;--card2:#20232c;--line:#2a2e39;--txt:#eef0f5;--mut:#8a90a0;--acc:#ffb547;--acc2:#ff7a1a;--blue:#3d7bff;
--c1:#9aa3b5;--c2:#3fa2ff;--c3:#8d5cff;--c4:#ff4fd8;--c5:#ffbf2e}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:80px;min-height:100vh}
button{font:inherit;color:inherit;border:0;cursor:pointer;background:none}
header{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;padding:12px 16px;background:rgba(14,15,19,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;letter-spacing:1px;font-size:18px}
.logo .m{width:34px;height:34px;border-radius:9px;background:linear-gradient(135deg,var(--acc),var(--acc2));display:grid;place-items:center;color:#1a1000;font-size:20px}
.bal{display:flex;align-items:center;gap:6px;background:var(--card2);padding:8px 12px;border-radius:12px;font-weight:700}
.coin{display:inline-block;width:16px;height:16px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#ffe7a3,#e8a020 60%,#a86a00);box-shadow:inset 0 0 0 2px #c98612;vertical-align:-3px}
.plus{background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1000;width:26px;height:26px;border-radius:8px;font-weight:900}
main{max-width:900px;margin:0 auto;padding:16px}
.live{display:flex;gap:8px;overflow-x:auto;padding:4px 0 14px;scrollbar-width:none}
.live::-webkit-scrollbar{display:none}
.drop{flex:0 0 112px;height:74px;border-radius:12px;background:var(--card);position:relative;overflow:hidden;padding:6px 8px;font-size:10px;color:var(--mut);display:flex;flex-direction:column;justify-content:flex-end;animation:pop .4s}
.drop::before{content:"";position:absolute;top:0;left:20%;right:20%;height:3px;border-radius:0 0 3px 3px;background:var(--rc)}
.drop svg{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:54px;height:40px}
.drop b{color:var(--txt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-weight:600;position:relative}
@keyframes pop{from{transform:scale(.6);opacity:0}}
h2{font-size:20px;margin:6px 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.case{background:var(--card);border-radius:18px;padding:12px;text-align:center;position:relative;overflow:hidden;transition:transform .15s}
.case:active{transform:scale(.97)}
.case .art{height:130px;display:grid;place-items:center}
.case .nm{font-weight:700;font-size:14px;margin:6px 0 8px}
.price{display:inline-flex;align-items:center;gap:5px;background:var(--card2);padding:6px 12px;border-radius:10px;font-weight:700;font-size:13px}
.tag{position:absolute;top:10px;left:10px;font-size:10px;font-weight:800;padding:3px 7px;border-radius:6px;background:var(--acc2);color:#1a0a00}
.page{display:none}.page.on{display:block}
.back{display:flex;align-items:center;gap:8px;font-size:22px;font-weight:900;text-transform:uppercase;margin-bottom:14px}
.back span{width:34px;height:34px;border-radius:10px;background:var(--card2);display:grid;place-items:center;font-size:18px}
.reel{position:relative;height:150px;background:var(--card);border-radius:18px;overflow:hidden;margin-bottom:14px}
.reel::before,.reel::after{content:"";position:absolute;top:0;bottom:0;width:60px;z-index:2;pointer-events:none}
.reel::before{left:0;background:linear-gradient(90deg,var(--card),transparent)}
.reel::after{right:0;background:linear-gradient(-90deg,var(--card),transparent)}
.marker{position:absolute;left:50%;top:0;bottom:0;width:3px;margin-left:-1.5px;background:var(--acc);z-index:3;box-shadow:0 0 12px var(--acc)}
.marker::before{content:"";position:absolute;top:0;left:-7px;border:8.5px solid transparent;border-top-color:var(--acc)}
.strip{position:absolute;top:15px;left:0;display:flex;gap:8px;will-change:transform}
.it{flex:0 0 112px;height:120px;border-radius:14px;background:linear-gradient(180deg,var(--card2),color-mix(in srgb,var(--rc) 22%,var(--card2)));position:relative;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;font-size:11px}
.it::before{content:"";position:absolute;top:0;left:22%;right:22%;height:3px;border-radius:0 0 3px 3px;background:var(--rc)}
.it svg{position:absolute;top:12px;left:50%;transform:translateX(-50%);width:80px;height:58px}
.it small{color:var(--mut);font-size:9px}
.it b{font-weight:600;line-height:1.15;position:relative}
.big{background:var(--case-art);display:grid;place-items:center;height:170px;border-radius:18px;margin-bottom:14px}
.btn{width:100%;padding:15px;border-radius:14px;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a1000;font-weight:800;font-size:16px;display:flex;justify-content:center;align-items:center;gap:8px}
.btn:disabled{opacity:.45}
.btn.sec{background:var(--card2);color:var(--txt)}
.qty{display:flex;gap:8px;margin-bottom:10px}
.qty button{flex:1;padding:10px;border-radius:12px;background:var(--card);font-weight:700}
.qty button.on{background:var(--card2);box-shadow:inset 0 0 0 2px var(--acc)}
.items{display:grid;grid-template-columns:repeat(auto-fill,minmax(105px,1fr));gap:8px;margin-top:20px}
.items .it{flex:none;width:auto}
.chance{position:absolute;top:6px;right:7px;font-size:9px;color:var(--mut)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:50;display:none;align-items:center;justify-content:center;padding:20px}
.modal.on{display:flex}
.mbox{background:var(--card);border-radius:22px;padding:20px;width:100%;max-width:380px;text-align:center;animation:pop .3s}
.mbox h3{font-size:18px;margin-bottom:12px}
.wins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-bottom:16px}
.wins .it{flex:0 0 140px;height:150px}
.wins .it svg{width:100px;height:72px}
.row{display:flex;gap:8px}
nav{position:fixed;bottom:0;left:0;right:0;z-index:30;display:flex;background:#121318;border-top:1px solid var(--line);padding:6px 0 calc(6px + env(safe-area-inset-bottom))}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:10px;color:var(--mut);padding:4px}
nav button.on{color:var(--acc)}
nav svg{width:22px;height:22px}
.empty{color:var(--mut);text-align:center;padding:40px 0}
.inv .it{cursor:pointer}
.inv .sell{position:absolute;inset:auto 6px 6px 6px;display:none}
.stat{display:flex;gap:10px;margin-bottom:14px}
.stat div{flex:1;background:var(--card);border-radius:14px;padding:12px;font-size:12px;color:var(--mut)}
.stat b{display:block;color:var(--txt);font-size:17px;margin-top:4px}
/* wheel */
.wheel-wrap{position:relative;width:300px;height:300px;margin:10px auto 18px}
#wheel{width:100%;height:100%;transition:transform 5s cubic-bezier(.15,.85,.2,1)}
.wptr{position:absolute;top:-6px;left:50%;transform:translateX(-50%);border:13px solid transparent;border-top:24px solid var(--acc);filter:drop-shadow(0 0 6px var(--acc));z-index:2}
.bets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.bets button{padding:14px 0;border-radius:12px;font-weight:800;font-size:16px;box-shadow:inset 0 0 0 2px transparent}
.bets button.on{box-shadow:inset 0 0 0 3px #fff}
.inp{display:flex;align-items:center;background:var(--card);border-radius:12px;padding:0 12px}
.inp input{flex:1;background:none;border:0;color:var(--txt);font:inherit;font-size:16px;padding:13px 0;outline:none}
.res{text-align:center;font-weight:800;min-height:24px;margin:8px 0}
.toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card2);padding:10px 16px;border-radius:12px;z-index:60;font-size:14px;display:none;box-shadow:0 8px 30px rgba(0,0,0,.5)}
.demo{font-size:11px;color:var(--mut);text-align:center;margin:24px 0 0}
.it svg{filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.it{transition:transform .2s}
.it:hover{transform:translateY(-3px) perspective(400px) rotateX(6deg)}
.it.r5::after,.case::after{content:"";position:absolute;inset:0;border-radius:inherit;background:linear-gradient(110deg,transparent 35%,rgba(255,255,255,.18) 50%,transparent 65%);background-size:250% 100%;animation:shine 3s infinite;pointer-events:none}
.it.r4{box-shadow:inset 0 0 0 1px color-mix(in srgb,var(--rc) 45%,transparent)}
.it.r5{box-shadow:inset 0 0 0 1px var(--rc),0 0 18px -4px var(--rc)}
@keyframes shine{0%{background-position:150% 0}100%{background-position:-50% 0}}

.case .art{height:auto;aspect-ratio:1.4;display:block;margin:-12px -12px 4px;border-radius:18px 18px 0 0;overflow:hidden}
.case .art img{width:100%;height:100%;object-fit:cover;display:block}
.case .free{background:linear-gradient(135deg,#3ddc84,#1fa35c);color:#04210f}
.big{height:auto;aspect-ratio:1.45;overflow:hidden;padding:0}
.big img{width:100%;height:100%;object-fit:cover;display:block}
.btn.green{background:linear-gradient(135deg,#3ddc84,#1fa35c);color:#04210f}
/* вертикальные барабаны */
.vreels{display:none;gap:6px;height:300px;margin-bottom:14px;position:relative}
.vreel{flex:1;position:relative;overflow:hidden;background:var(--card);border-radius:14px}
.vreel::before,.vreel::after{content:"";position:absolute;left:0;right:0;height:70px;z-index:2;pointer-events:none}
.vreel::before{top:0;background:linear-gradient(180deg,var(--card),transparent)}
.vreel::after{bottom:0;background:linear-gradient(0deg,var(--card),transparent)}
.vline{position:absolute;left:-4px;right:-4px;top:50%;height:3px;margin-top:-1.5px;background:var(--acc);box-shadow:0 0 12px var(--acc);z-index:5;pointer-events:none}
.vstrip{position:absolute;left:4px;right:4px;top:0;display:flex;flex-direction:column;gap:6px;will-change:transform}
.vstrip .it{flex:0 0 94px;width:auto;height:94px;padding:5px;font-size:9px}
.vstrip .it svg{width:58px;height:42px;top:8px}
.vstrip .it small{display:none}
.vreel.done{box-shadow:0 0 0 2px var(--rc),0 0 22px -4px var(--rc)}
.vreel.done .vstrip{filter:brightness(1.15)}
/* игры */
.ghub{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.gcard{background:var(--card);border-radius:18px;padding:16px;text-align:left;min-height:120px;position:relative;overflow:hidden}
.gcard b{font-size:17px;display:block;margin-top:46px}
.gcard small{color:var(--mut);font-size:12px}
.gcard .gi{position:absolute;top:14px;left:14px;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:22px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:4px;gap:4px;margin:10px 0}
.seg button{flex:1;padding:10px 0;border-radius:9px;font-weight:700;font-size:13px;color:var(--mut)}
.seg button.on{background:var(--card2);color:var(--txt)}
.qb{display:flex;gap:6px;margin-left:8px}
.qb button{background:var(--card2);padding:7px 10px;border-radius:8px;font-size:12px;font-weight:700}
.mgrid{display:grid;gap:7px;margin:6px 0 10px}
.cell{aspect-ratio:1;border-radius:12px;background:linear-gradient(180deg,#2a2e3a,#1d2029);font-size:22px;display:grid;place-items:center;color:var(--mut);font-weight:800;box-shadow:inset 0 -3px 0 rgba(0,0,0,.35);transition:transform .15s}
.cell:active{transform:scale(.94)}
.cell.gem{background:linear-gradient(180deg,#1e6b48,#124430);color:#fff;animation:pop .25s}
.cell.bomb{background:linear-gradient(180deg,#8a2232,#4d121c);animation:pop .25s}
.cell.dim{opacity:.45}
.minfo{display:flex;justify-content:space-between;color:var(--mut);font-size:13px;margin-bottom:8px}
.minfo b{color:var(--txt)}
#plinko{width:100%;display:block;background:linear-gradient(180deg,#1b2a44,#14203a);border-radius:18px}
.pslots{display:flex;gap:3px;margin:6px 0;padding:0 6.5%}
.pslots div{flex:1;text-align:center;font-size:10px;font-weight:800;padding:5px 0;border-radius:6px;color:#1a1000;transition:transform .15s}
.pslots div.hit{transform:translateY(4px) scale(1.08)}
/* апгрейд */
.upw{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.upw .slot{flex:1;height:130px;border-radius:16px;background:var(--card);display:grid;place-items:center;color:var(--mut);font-size:12px;text-align:center;position:relative;overflow:hidden}
.upw .slot .it{width:100%;height:100%;border-radius:16px}
.ring{width:150px;height:150px;flex:0 0 150px;position:relative}
.ring svg{width:100%;height:100%}
.ring .pct{position:absolute;inset:0;display:grid;place-items:center;font-weight:900;font-size:22px}
#uptr{transform-origin:75px 75px;transition:transform 4s cubic-bezier(.15,.85,.2,1)}
.uplist{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;max-height:330px;overflow:auto;padding:2px}
.uplist .sel .it{box-shadow:0 0 0 2px #fff}
.mult{display:flex;gap:6px;margin:8px 0}
.mult button{flex:1;background:var(--card);padding:9px 0;border-radius:10px;font-weight:800;font-size:13px}
.mult button.on{background:var(--card2);box-shadow:inset 0 0 0 2px var(--acc)}
.it .pi{position:absolute;top:8px;left:50%;transform:translateX(-50%);width:86%;height:62px;object-fit:contain;filter:drop-shadow(0 4px 6px rgba(0,0,0,.5))}
.wins .it .pi{height:80px}
.hasimg>svg{display:none}
.drop .pi{position:absolute;top:6px;left:50%;transform:translateX(-50%);width:54px;height:40px;object-fit:contain}
.wd{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--card);padding:10px 12px;border-radius:12px;margin-top:6px;font-size:13px}
.wd small{display:block;color:var(--mut);font-size:11px;margin-top:2px}.wd span{white-space:nowrap;font-size:12px}
.pnum{font-size:12px;color:var(--mut);font-weight:600;margin-left:6px}
.mbox .inp input{width:100%}
.auth{position:fixed;inset:0;z-index:60;background:var(--bg);display:none;align-items:center;justify-content:center;padding:20px}
.auth.on{display:flex}.abox{width:100%;max-width:360px;text-align:center}
.abox .inp input{width:100%}
</style>
</head>
<body>
<header>
  <div class="logo"><div class="m">M</div>METRO DROP</div>
  <div class="row" style="align-items:center">
    <div class="bal"><span class="coin"></span><span id="bal">0</span></div>
    <button class="plus" onclick="topup()">+</button>
  </div>
</header>

<main>
  <div class="live" id="live"></div>

  <section class="page on" id="p-cases">
    <h2>Кейсы Metro Royale</h2>
    <div class="grid" id="grid"></div>
    <p class="demo" id="notice"></p>
  </section>

  <section class="page" id="p-case">
    <div class="back" onclick="go('cases')"><span>‹</span><div id="cname"></div></div>
    <div class="reel" id="reelBox" style="display:none"><div class="marker"></div><div class="strip" id="strip"></div></div>
    <div class="vreels" id="vreels"></div>
    <div class="big" id="cbig"></div>
    <div class="qty" id="qty"></div>
    <button class="btn" id="openBtn" onclick="openCase()"></button>
    <h2 style="margin-top:22px">Содержимое кейса</h2>
    <div class="items" id="citems"></div>
  </section>

  <section class="page" id="p-games">
    <h2>Игры</h2>
    <div class="ghub">
      <button class="gcard" onclick="go('mines')"><div class="gi" style="background:#1e6b48">💣</div><b>Сапёр</b><small>3×3, 5×5, 7×7</small></button>
      <button class="gcard" onclick="go('plinko')"><div class="gi" style="background:#2a4f8f">🔵</div><b>Плинко</b><small>Шарик до ×29</small></button>
      <button class="gcard" onclick="go('wheel')"><div class="gi" style="background:#8f2a3a">🎡</div><b>Колесо</b><small>До ×50</small></button>
      <button class="gcard" onclick="go('upgrade')"><div class="gi" style="background:#6a3fc4">⬆️</div><b>Апгрейд</b><small>Предмет → лучше</small></button>
    </div>
  </section>

  <section class="page" id="p-mines">
    <div class="back" onclick="go('games')"><span>‹</span><div>Сапёр</div></div>
    <div class="minfo"><span>Множитель: <b id="mMul">x1.00</b></span><span>Следующий: <b id="mNext">—</b></span></div>
    <div class="mgrid" id="mgrid"></div>
    <div class="seg" id="mSize"></div>
    <div class="seg" id="mBombs"></div>
    <div class="inp"><input id="mBet" type="number" value="50" min="1"><span class="coin"></span><div class="qb"><button onclick="betOp('mBet',.5)">½</button><button onclick="betOp('mBet',2)">×2</button></div></div>
    <div style="height:10px"></div>
    <button class="btn" id="mBtn" onclick="minesBtn()">Сделать ставку</button>
  </section>

  <section class="page" id="p-plinko">
    <div class="back" onclick="go('games')"><span>‹</span><div>Плинко</div></div>
    <canvas id="plinko" width="600" height="460"></canvas>
    <div class="pslots" id="pslots"></div>
    <div class="seg" id="pDiff"></div>
    <div class="inp"><input id="pBet" type="number" value="20" min="1"><span class="coin"></span><div class="qb"><button onclick="betOp('pBet',.5)">½</button><button onclick="betOp('pBet',2)">×2</button></div></div>
    <div class="res" id="pres"></div>
    <button class="btn" onclick="dropBall()">Бросить шар</button>
  </section>

  <section class="page" id="p-wheel">
    <div class="back" onclick="go('games')"><span>‹</span><div>Колесо</div></div>
    <div class="wheel-wrap"><div class="wptr"></div><svg id="wheel" viewBox="-100 -100 200 200"></svg></div>
    <div class="inp"><input id="wbet" type="number" value="50" min="1"><span class="coin"></span></div>
    <div class="bets" id="bets"></div>
    <div class="res" id="wres"></div>
    <button class="btn" id="wbtn" onclick="spinWheel()">Крутить</button>
  </section>

  <section class="page" id="p-upgrade">
    <h2>Апгрейд</h2>
    <div class="upw">
      <div class="slot" id="upFrom">Выбери свой предмет</div>
      <div class="ring"><svg viewBox="0 0 150 150"><circle cx="75" cy="75" r="62" fill="none" stroke="#20232c" stroke-width="14"/><circle id="upArc" cx="75" cy="75" r="62" fill="none" stroke="#3ddc84" stroke-width="14" stroke-dasharray="0 400" transform="rotate(-90 75 75)" stroke-linecap="round"/><g id="uptr"><path d="M75 4l7 14h-14z" fill="#fff"/></g></svg><div class="pct" id="upPct">0%</div></div>
      <div class="slot" id="upTo">Выбери цель</div>
    </div>
    <div class="res" id="upRes"></div>
    <button class="btn" id="upBtn" onclick="doUpgrade()" disabled>Апгрейд</button>
    <h2 style="margin-top:18px;font-size:16px">Твой предмет</h2>
    <div class="uplist" id="upInv"></div>
    <h2 style="margin-top:18px;font-size:16px">Цель</h2>
    <div class="mult" id="upMult"></div>
    <div class="uplist" id="upTargets"></div>
  </section>

  <section class="page" id="p-inv">
    <h2 style="display:flex;justify-content:space-between;align-items:center">Инвентарь <small class="pnum" id="pNum"></small><button class="btn sec" style="width:auto;padding:7px 12px;font-size:12px;margin-left:auto" onclick="logout()">Выйти</button></h2>
    <div class="stat"><div>Предметов<b id="sCnt">0</b></div><div>Стоимость<b id="sSum">0</b></div><div>Открыто<b id="sOpen">0</b></div></div>
    <button class="btn sec" style="margin-bottom:12px" onclick="sellAll()">Продать всё</button>
    <div class="items inv" id="inv"></div>
    <div id="wdBox"></div>
  </section>
</main>

<nav>
  <button class="on" data-p="cases" onclick="go('cases')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M3 8l9-5 9 5v9l-9 5-9-5zm2 1.2v6.6l6 3.3v-6.6zm14 0l-6 3.3v6.6l6-3.3zM12 5.3L6.2 8.5 12 11.7l5.8-3.2z"/></svg>Кейсы</button>
  <button data-p="games" onclick="go('games')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 7h10a5 5 0 015 5v1a4 4 0 01-7.2 2.4L14 14h-4l-.8 1.4A4 4 0 012 13v-1a5 5 0 015-5zm0 3v1.5H5.5V13H7v1.5h1.5V13H10v-1.5H8.5V10zm9 .5a1 1 0 100 2 1 1 0 000-2zm2 2a1 1 0 100 2 1 1 0 000-2z"/></svg>Игры</button>
  <button data-p="upgrade" onclick="go('upgrade')"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 3l7 7h-4v5H9v-5H5zm-7 15h14v3H5z"/></svg>Апгрейд</button>

// ---------- подключение к базе ----------
const CFG=window.METRO_CFG||{};
const sb=(window.supabase&&CFG.url&&CFG.key)?supabase.createClient(CFG.url,CFG.key):null;
let ITEMS={},CASES=[],SET={},WD=[];
let FREE_MS=24*3600*1000;
let S={bal:0,inv:[],opened:0,lastFree:0,num:0,uid:null,pubg:''};
const fmt=n=>(Math.round(n*100)/100).toLocaleString('ru');
const $=id=>document.getElementById(id);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let cur=null,count=1,busy=false,won=[];

function errText(e){const m=(e&&e.message)||String(e);return /fetch|network|Failed/i.test(m)?'Нет связи с сервером':m}
async function rpc(fn,args){const{data,error}=await sb.rpc(fn,args||{});if(error){toast(errText(error));throw error}return data}

async function loadCatalog(){
 const [it,cs,ci,st]=await Promise.all([
  sb.from('items').select('*').order('sort'),
  sb.from('cases').select('*').eq('active',true).order('sort'),
  sb.from('case_items').select('*'),
  sb.from('settings').select('key,value')]);
 for(const r of [it,cs,ci,st])if(r.error)throw r.error;
 ITEMS={};it.data.forEach(i=>ITEMS[i.id]=[i.name,i.type,i.rarity,+i.price,i.img,i.withdrawable,i.active]);
 SET={};st.data.forEach(s=>SET[s.key]=s.value);
 FREE_MS=(+SET.free_hours||24)*3600*1000;
 CASES=cs.data.map(c=>({id:c.id,name:c.name,price:+c.price,col:c.col,img:c.img||'img/free.jpg',tag:c.tag,pool:{}}));
 ci.data.forEach(r=>{const c=CASES.find(x=>x.id===r.case_id);if(c&&ITEMS[r.item_id]&&ITEMS[r.item_id][6])c.pool[r.item_id]=+r.weight});
 CASES=CASES.filter(c=>Object.keys(c.pool).length);
}
async function loadMe(){
 const m=await rpc('me');
 S.bal=+m.balance;S.opened=m.opened;S.num=m.num;S.pubg=m.pubg_id||'';S.lastFree=m.last_free?Date.parse(m.last_free):0;
 if(m.banned)toast('Аккаунт заблокирован');
 const{data,error}=await sb.from('inventory').select('id,item_id').eq('user_id',S.uid).eq('status','own').order('id',{ascending:false});
 if(error)throw error;
 S.inv=data.filter(r=>ITEMS[r.item_id]).map(r=>({id:r.id,k:r.item_id}));
 if(m.mines)mResume(m.mines);
 loadWd();
}
async function loadWd(){
 const{data}=await sb.from('withdrawals').select('id,item_id,pubg_id,status,note').eq('user_id',S.uid).order('id',{ascending:false}).limit(20);
 WD=data||[];renderWd();
}
async function boot(){
 mSetup();pSetup();
 if(!sb){$('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Сайт ещё не подключён к базе (config.js)</div>';return}
 $('grid').innerHTML='<div class="empty" style="grid-column:1/-1">Загрузка…</div>';
 try{
  const{data:{session}}=await sb.auth.getSession();
  if(!session||session.user.is_anonymous){showAuth();return}
  S.uid=session.user.id;S.email=session.user.email||'';$('auth').classList.remove('on');
  await loadCatalog();await loadMe();
  render();startLive();
 }catch(e){console.error(e);$('grid').innerHTML=`<div class="empty" style="grid-column:1/-1">Ошибка: ${esc(errText(e))}<br><br><button class="btn" onclick="location.reload()">Обновить</button></div>`}
}

// ---------- вход / регистрация ----------
let authMode='login';
function showAuth(){$('grid').innerHTML='';$('auth').classList.add('on');setAuth(authMode)}
function setAuth(m){authMode=m;document.querySelectorAll('#authTabs button').forEach(b=>b.classList.toggle('on',b.dataset.m===m));
 $('aBtn').textContent=m==='login'?'Войти':'Создать аккаунт';$('aPass2w').style.display=m==='login'?'none':'';$('aMsg').textContent=''}
async function authGo(){
 const email=$('aEmail').value.trim().toLowerCase(),pass=$('aPass').value,msg=$('aMsg');
 if(!/^\S+@\S+\.\S+$/.test(email))return msg.textContent='Введи почту';
 if(pass.length<6)return msg.textContent='Пароль — минимум 6 символов';
 if(authMode==='reg'&&pass!==$('aPass2').value)return msg.textContent='Пароли не совпадают';
 $('aBtn').disabled=true;msg.textContent=authMode==='login'?'Вход…':'Создаю аккаунт…';
 let r;
 if(authMode==='reg'){
  r=await sb.auth.signUp({email,password:pass});
  if(!r.error&&!r.data.session)r=await sb.auth.signInWithPassword({email,password:pass});
 }else r=await sb.auth.signInWithPassword({email,password:pass});
 $('aBtn').disabled=false;
 if(r.error){const m=r.error.message||'';
  msg.textContent=/already registered|already exists/i.test(m)?'Такая почта уже зарегистрирована — нажми «Вход»'
   :/Invalid login/i.test(m)?'Неверная почта или пароль'
   :/not confirmed/i.test(m)?'Подтверди почту по ссылке из письма и войди'
   :/rate limit/i.test(m)?'Слишком много попыток, подожди немного'
   :'Ошибка: '+m;return}
 boot();
}
async function logout(){await sb.auth.signOut();location.reload()}

// Фото предмета: из админки (Supabase) или файл img/items/<id>.png. Нет фото — SVG-иконка.
function art(k,t,c){const src=ITEMS[k][4]||`img/items/${k}.png`;return ico(t,c)+`<img class="pi" src="${esc(src)}" alt="" loading="lazy" onload="this.parentNode.classList.add('hasimg')" onerror="this.remove()">`}
function itemHTML(k,extra=''){if(!ITEMS[k])return '';const[n,t,r,p]=ITEMS[k];return `<div class="it r${r}" style="--rc:${R[r]}">${extra}${art(k,t,R[r])}<small>${RN[r]} · ${fmt(p)}</small><b>${esc(n)}</b></div>`}
function freeLeft(){return Math.max(0,S.lastFree+FREE_MS-Date.now())}
function hms(ms){const s=Math.ceil(ms/1000);return [Math.floor(s/3600),Math.floor(s%3600/60),s%60].map(x=>String(x).padStart(2,'0')).join(':')}

function renderBal(){$('bal').textContent=fmt(S.bal);if(cur)updBtn()}
function render(){
 renderBal();
 $('grid').innerHTML=CASES.map(c=>{
   const pr=c.price?`${fmt(c.price)} <span class="coin"></span>`:(freeLeft()?`⏱ ${hms(freeLeft())}`:'Бесплатно');

const PM={easy:[5.6,2.1,1.1,1,.5,1,1.1,2.1,5.6],mid:[13,3,1.3,.7,.4,.7,1.3,3,13],hard:[29,4,1.5,.3,.2,.3,1.5,4,29]};
let pd='easy',balls=[],pRAF=0,pPend=0;
const PROWS=8,cv=$('plinko'),cx=cv.getContext('2d');
const PW=600,PH=460,GAP=58,TOP=50;
const peg=(r,j)=>({x:PW/2+(j-r/2)*GAP,y:TOP+(r-2)*46});
function slotColor(m){return m>=10?'#ff4a4a':m>=2?'#ff9a2e':m>=1?'#ffd23f':'#3dd6c4'}
function pSetup(){
 $('pDiff').innerHTML=[['easy','Легко'],['mid','Средне'],['hard','Сложно']].map(([k,n])=>`<button class="${k===pd?'on':''}" onclick="if(!balls.length){pd='${k}';pSetup()}">${n}</button>`).join('');
 $('pslots').innerHTML=PM[pd].map(m=>`<div style="background:${slotColor(m)}">${m}</div>`).join('');
 drawPlinko();
}
function drawPlinko(){
 cx.clearRect(0,0,PW,PH);
 cx.fillStyle='#e8eefc';for(let r=0;r<PROWS;r++)for(let j=0;j<=r+2;j++){const p=peg(r+2,j);cx.beginPath();cx.arc(p.x,p.y,5,0,7);cx.fill()}
 balls.forEach(b=>{cx.beginPath();cx.arc(b.x,b.y,10,0,7);const g=cx.createRadialGradient(b.x-3,b.y-3,1,b.x,b.y,10);g.addColorStop(0,'#fff');g.addColorStop(1,'#ff9a2e');cx.fillStyle=g;cx.shadowColor='#ff9a2e';cx.shadowBlur=14;cx.fill();cx.shadowBlur=0});
}
async function dropBall(){
 const bet=getBet('pBet');if(!bet)return;
 const diff=pd;
 let r;try{r=await rpc('plinko_drop',{p_bet:bet,p_diff:diff})}catch(e){return}
 const win=+r.win;pPend+=win;S.bal=+r.balance-pPend;renderBal();
 const pts=[{x:PW/2,y:10}];let col=0;
 for(let i=0;i<PROWS;i++){const p=peg(i+2,col+1);pts.push({x:p.x,y:p.y-14});col+=r.path[i]}
 const sx=PW/2+(col-PROWS/2)*GAP;pts.push({x:sx,y:PH-12});
 balls.push({pts,seg:0,t:0,x:PW/2,y:10,win,mult:r.mult,slot:r.slot});
 if(!pRAF)pRAF=requestAnimationFrame(pTick);
}
function pTick(){
 balls.forEach(b=>{b.t+=0.085;if(b.t>=1){b.t=0;b.seg++}
  if(b.seg>=b.pts.length-1){b.done=true;return}
  const a=b.pts[b.seg],c=b.pts[b.seg+1],t=b.t;b.x=a.x+(c.x-a.x)*t;b.y=a.y+(c.y-a.y)*t-Math.sin(t*Math.PI)*14});
 balls.filter(b=>b.done).forEach(b=>{pPend-=b.win;S.bal+=b.win;renderBal();
  const r=$('pres');r.style.color=b.mult>=1?'#3ddc84':'#ff6b6b';r.textContent=`x${b.mult} → ${fmt(b.win)}`;
  const s=$('pslots').children[b.slot];s.classList.add('hit');setTimeout(()=>s.classList.remove('hit'),200)});
 balls=balls.filter(b=>!b.done);drawPlinko();
 pRAF=balls.length?requestAnimationFrame(pTick):0;
}

const WSEG=[];const WM=[{m:2,c:'#3d7bff',n:24},{m:3,c:'#22c57a',n:16},{m:5,c:'#e8364a',n:10},{m:50,c:'#ffbf2e',n:1}];

for(let i=WSEG.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[WSEG[i],WSEG[j]]=[WSEG[j],WSEG[i]]}
(function(){const n=WSEG.length,a=2*Math.PI/n;let h='';WSEG.forEach((s,i)=>{const a0=i*a-Math.PI/2-a/2,a1=a0+a;h+=`<path d="M0 0L${95*Math.cos(a0)} ${95*Math.sin(a0)}A95 95 0 0 1 ${95*Math.cos(a1)} ${95*Math.sin(a1)}Z" fill="${s.c}" stroke="#0e0f13" stroke-width="1"/>`});
 h+=`<circle r="36" fill="#181a21" stroke="#2a2e39" stroke-width="3"/><text y="7" text-anchor="middle" font-size="20" font-weight="900" fill="#ffb547" font-family="sans-serif">M</text>`;$('wheel').innerHTML=h})();

$('bets').innerHTML=WM.map((o,i)=>`<button style="background:${o.c};color:${i===3?'#1a1000':'#fff'}" class="${i?'':'on'}" onclick="pickW(${i},this)">${o.m}x</button>`).join('');

async function spinWheel(){

 busy=true;$('wres').textContent='';$('wbtn').disabled=true;
 let r;try{r=await rpc('wheel_spin',{p_bet:bet,p_pick:pick})}catch(e){busy=false;$('wbtn').disabled=false;return}
 const win=+r.win;S.bal=+r.balance-win;renderBal();
 const idx=WSEG.map((s,i)=>s===WM[r.res]?i:-1).filter(i=>i>=0),i=idx[Math.floor(Math.random()*idx.length)],n=WSEG.length;
 wrot+=360*6+((360-(i*360/n))-(wrot%360)+360)%360+(Math.random()-.5)*(360/n)*.7;
 $('wheel').style.transform=`rotate(${wrot}deg)`;

}

let upSel=null,upTgt=null,upMul=2,uprot=0;
function upFromK(){const o=S.inv.find(o=>o.id===upSel);return o?o.k:null}
function upChance(){const f=upFromK();if(!f||!upTgt)return 0;return Math.min(+SET.upgrade_max||.8,ITEMS[f][3]/ITEMS[upTgt][3]*(+SET.upgrade_edge||.95))}
function renderUp(){
 if(upSel!==null&&!upFromK())upSel=null;
 $('upInv').innerHTML=S.inv.length?S.inv.map(o=>`<div class="${o.id===upSel?'sel':''}" onclick="upPick(${o.id})">${itemHTML(o.k)}</div>`).join(''):'<div class="empty" style="grid-column:1/-1">Нет предметов — открой кейс</div>';
 $('upMult').innerHTML=[1.5,2,3,5,10].map(m=>`<button class="${m===upMul?'on':''}" onclick="upMul=${m};upTgt=null;renderUp()">x${m}</button>`).join('');
 const f=upFromK(),base=f?ITEMS[f][3]:0;
 const list=Object.keys(ITEMS).filter(k=>ITEMS[k][6]&&ITEMS[k][3]>base&&(!base||ITEMS[k][3]>=base*upMul*.6)).sort((a,b)=>ITEMS[a][3]-ITEMS[b][3]);
 $('upTargets').innerHTML=list.map(k=>`<div class="${k===upTgt?'sel':''}" onclick="upTgt='${k}';renderUp()">${itemHTML(k)}</div>`).join('');
 $('upFrom').innerHTML=f?itemHTML(f):'Выбери свой предмет';
 $('upTo').innerHTML=upTgt?itemHTML(upTgt):'Выбери цель';
 const ch=upChance();$('upPct').textContent=(ch*100).toFixed(1)+'%';
 $('upArc').setAttribute('stroke-dasharray',`${ch*389.6} 400`);
 $('upBtn').disabled=busy||!ch;
}
function upPick(id){if(busy)return;upSel=id;upTgt=null;renderUp()}
async function doUpgrade(){
 if(!upChance()||busy)return;busy=true;$('upBtn').disabled=true;$('upRes').textContent='';
 const fromId=upSel,from=upFromK(),tgt=upTgt;
 let r;try{r=await rpc('upgrade_item',{p_inv:fromId,p_target:tgt})}catch(e){busy=false;renderUp();return}
 const ch=+r.chance,win=r.win;
 const ang=win?Math.random()*ch*360*.9+ch*18:ch*360+Math.random()*(360-ch*360)*.9+(360-ch*360)*.05;
 uprot+=360*5+((ang-(uprot%360))+360)%360;
 $('uptr').style.transform=`rotate(${uprot}deg)`;
 setTimeout(()=>{busy=false;const res=$('upRes');S.inv=S.inv.filter(o=>o.id!==fromId);
  if(win){S.inv.unshift({id:r.inv,k:tgt});res.style.color='#3ddc84';res.textContent=`Успех! Получен ${ITEMS[tgt][0]}`;addLive(tgt)}
  else{res.style.color='#ff6b6b';res.textContent=`Не повезло — ${ITEMS[from][0]} сгорел`}
  upSel=null;upTgt=null;render()},4200);
}

boot();
</script>
